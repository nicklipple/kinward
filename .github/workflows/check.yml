name: Kinward checks
on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap pinned development dependencies
        run: make bootstrap
      - name: Check
        run: make check
      - name: Verify failure detection
        run: python3 scripts/verify_guardrails.py
      - name: Package
        run: make package
